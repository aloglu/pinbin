<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Pinbin</title>
  <meta name="application-name" content="Pinbin" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Pinbin" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ECEDEA" />
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
  <link rel="icon" type="image/svg+xml" href="/static/brand/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/brand/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/static/css/fonts.css?v=1" />
  <link rel="stylesheet" href="/static/css/tokens.css?v=1" />
  <link rel="stylesheet" href="/static/css/base.css?v=1" />
  <link rel="stylesheet" href="/static/css/screens.css?v=1" />
  <link rel="stylesheet" href="/static/css/projects.css?v=1" />
  <link rel="stylesheet" href="/static/css/shopping.css?v=1" />
  <link rel="stylesheet" href="/static/css/glossary.css?v=1" />
  <link rel="stylesheet" href="/static/css/bench.css?v=1" />
  <link rel="stylesheet" href="/static/css/settings.css?v=1" />
  <link rel="stylesheet" href="/static/css/edit.css?v=1" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('pb-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        var f = localStorage.getItem('pb-font');
        if (f === 'instrument') document.documentElement.setAttribute('data-font', 'instrument');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="bar">
    <div class="bar-in">
      <a class="mark" href="#inventory" aria-label="Pinbin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8" cy="8" r="1.4" fill="currentColor"/>
          <circle cx="16" cy="16" r="1.4" fill="currentColor"/>
          <path d="M8 8h5a3 3 0 0 1 3 3v5"/>
        </svg>
        <span>pinbin</span>
      </a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="right">
        <a class="btn quiet" href="#settings" id="gearBtn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
          </svg>
        </a>
        <button class="btn quiet" type="button" data-act="theme" id="themeBtn" aria-label="Switch light or dark"></button>
      </div>
    </div>
    <div id="barslot"></div>
  </header>

  <main id="app"></main>
  <div id="popRoot"></div>
  <div id="toastRoot"></div>
  <div id="lightboxRoot"></div>

  <script type="module" src="/static/js/main.js?v=1"></script>
</body>
</html>
