<style>
/* Layout: every screen = a working surface + one inspector on the right (bottom sheet on phones).
   Wire colour = what it carries. Severity colours are reserved for warnings. Small type; motion only where something changes. */
:root {
  --bg: #ECEDEA; --surface: #F7F7F5; --raised: #FFFFFF; --line: #D3D4CF; --hair: #E2E3DF;
  --ink: #141517; --ink-2: #44464A; --ink-3: #686A6E; --dot: rgba(0,0,0,.10);
  --bat: #7C4DDB; --v33: #E3701B; --v5: #C8302C; --i2c: #0F9A8A; --spi: #2F5BD3; --sig: #7D7F83;
  --danger: #D93A36; --check: #C99400; --ok: #2E9A61; --sel: #17181A;
  --danger-bg: #FBE6E4; --check-bg: #FBF1D3; --ok-bg: #E1F2E7;
  --sans: 'IBM Plex Sans', 'Segoe UI', Arial, system-ui, sans-serif; --w-body: 400; --w-mid: 500; --w-strong: 600;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
}
:root[data-font="instrument"] { --sans: 'Instrument Sans', 'Segoe UI', Arial, system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace; --w-body: 460; --w-mid: 560; --w-strong: 650; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1E1D1B; --surface: #262522; --raised: #2F2E2A; --line: #403E39; --hair: #33322E;
  --ink: #EDEAE4; --ink-2: #BDB8AE; --ink-3: #8F8A81; --dot: rgba(255,240,220,.06);
  --bat: #A98BF0; --v33: #F09653; --v5: #F2766B; --i2c: #4CC2AF; --spi: #8AA6F0; --sig: #A09B92;
  --danger: #F2766B; --check: #E8B94A; --ok: #6FC08F; --sel: #EDEAE4;
  --danger-bg: #3B2421; --check-bg: #3A3020; --ok-bg: #20322A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1E1D1B; --surface: #262522; --raised: #2F2E2A; --line: #403E39; --hair: #33322E;
  --ink: #EDEAE4; --ink-2: #BDB8AE; --ink-3: #8F8A81; --dot: rgba(255,240,220,.06);
  --bat: #A98BF0; --v33: #F09653; --v5: #F2766B; --i2c: #4CC2AF; --spi: #8AA6F0; --sig: #A09B92;
  --danger: #F2766B; --check: #E8B94A; --ok: #6FC08F; --sel: #EDEAE4;
  --danger-bg: #3B2421; --check-bg: #3A3020; --ok-bg: #20322A; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); font-weight: var(--w-body); text-rendering: optimizeLegibility; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
p { margin: 0; }
h1, h2, h3 { margin: 0; font-weight: var(--w-strong); }
b, strong { font-weight: var(--w-strong); }
h1 { font-size: 15px; } h2 { font-size: 14px; }
.mono { font-family: var(--mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.k { display: inline-block; font-family: var(--sans); font-size: 12px; font-weight: var(--w-mid); color: var(--ink-2); }
.k::first-letter { text-transform: uppercase; }
.dim { color: var(--ink-2); } .faint { color: var(--ink-3); }
code { font: 500 12px var(--mono); background: var(--hair); padding: 0 3px; border-radius: 2px; }

/* bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 40; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-in { height: 42px; display: flex; align-items: center; gap: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mark { display: flex; align-items: center; gap: 7px; font-weight: 600; text-decoration: none; }
.mark svg { width: 18px; height: 18px; }
.nav { display: flex; height: 100%; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { font-weight: var(--w-mid); display: flex; align-items: center; gap: 6px; padding: 0 10px; text-decoration: none; color: var(--ink-2); white-space: nowrap; position: relative; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current] { color: var(--ink); }
.nav a[aria-current]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--ink); }
.nav .c { font: 500 11.5px var(--mono); color: var(--ink-3); }
.bar .right { margin-left: auto; }
@media (max-width: 720px) { .bar-in { gap: 8px; } .mark span { display: none; } .nav a { padding: 0 8px; } }

/* controls */
.btn { font-weight: var(--w-mid); display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--line); background: var(--raised); border-radius: 4px; cursor: pointer; text-decoration: none; white-space: nowrap; font-size: 13px; transition: transform .1s; }
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn.ink { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.quiet { background: none; border-color: transparent; color: var(--ink-2); }
.btn.quiet:hover { color: var(--ink); border-color: var(--line); }
.btn svg { width: 14px; height: 14px; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--raised); }
.tabs button { border: 0; background: none; height: 26px; padding: 0 10px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
.tabs button + button { border-left: 1px solid var(--line); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.bin { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; font: 500 12px var(--mono); background: var(--ink); color: var(--bg); border-radius: 2px; }
.sev { width: 17px; height: 17px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 11.5px var(--mono); color: #fff; flex: none; }
.sev.danger { background: var(--danger); } .sev.check { background: var(--check); color: #1a1400; } .sev.ok { background: var(--ok); }
.sev.done { background: none; box-shadow: inset 0 0 0 1.5px var(--ok); color: var(--ok); }
.src { font: 500 11.5px var(--mono); color: var(--ink-3); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; text-transform: uppercase; letter-spacing: .04em; }
.ph { background: var(--bg); border-radius: 3px; display: grid; place-items: center; color: var(--ink-3); flex: none; }
.ph svg { width: 58%; height: 58%; }
.term { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: help; text-decoration: underline dotted var(--ink-3); text-underline-offset: 3px; }
.vt { font: 500 11.5px var(--mono); padding: 0 4px; height: 16px; display: inline-flex; align-items: center; border-radius: 2px; border: 1px solid; }
.vt.v33 { color: var(--v33); border-color: var(--v33); } .vt.v5 { color: var(--danger); border-color: var(--danger); } .vt.vboth { color: var(--ok); border-color: var(--ok); } .vt.if { color: var(--ink-2); border-color: var(--line); }

/* frame */
.screen { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: calc(100vh - 43px); }
.screen.full { grid-template-columns: minmax(0, 1fr); }
.work { min-width: 0; padding: 14px max(16px, env(safe-area-inset-left, 0px)) 48px; }
@keyframes in { from { opacity: 0; transform: translateY(4px); } }
.insp { border-left: 1px solid var(--line); background: var(--surface); position: sticky; top: calc(43px + env(safe-area-inset-top, 0px)); height: calc(100vh - 43px - env(safe-area-inset-top, 0px)); overflow: auto; padding-right: env(safe-area-inset-right, 0px); }
.insp-in { padding: 14px 16px 40px; animation: swap .25s var(--ease); }
@keyframes swap { from { opacity: 0; transform: translateX(6px); } }
.insp-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.insp .sec { padding: 12px 0; border-top: 1px solid var(--hair); }
.insp .sec:first-of-type { border-top: 0; padding-top: 0; }
.insp .sec > .k { display: block; margin-bottom: 6px; }
.close { display: none; }
@media (max-width: 980px) {
  .screen { grid-template-columns: minmax(0, 1fr); }
  .insp { position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: auto; max-height: 74vh; border-left: 0; border-top: 1px solid var(--line); z-index: 35; border-radius: 10px 10px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.18); padding-bottom: env(safe-area-inset-bottom, 0px); transform: translateY(105%); transition: transform .3s var(--ease); }
  .insp.open { transform: none; }
  .close { display: inline-flex; }
  .work { padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
.toolbar { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar .grow { flex: 1; }
.stat { display: flex; gap: 14px; flex-wrap: wrap; }
.stat div { display: flex; gap: 6px; align-items: baseline; }
.stat b { font: 500 13px var(--mono); }
.meter { width: 60px; height: 4px; background: var(--hair); border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle; }
.meter i { display: block; height: 100%; background: var(--ok); transition: width .5s var(--ease); }

/* inventory: project strip + grid */
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; margin-bottom: 14px; }
.pj { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 10px; background: var(--raised); border: 1px solid var(--line); border-radius: 4px; align-items: center; }
.pj.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.pj .nm { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.pj .nx { color: var(--ink-2); font-size: 13px; display: flex; gap: 6px; align-items: center; }
.pj .acts { grid-row: 1 / 3; grid-column: 2; align-self: start; display: flex; gap: 4px; }
.pj.new::before { display: none; }
.pj.new { border-style: dashed; color: var(--ink-2); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; min-height: 52px; }
.lensbar { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 8px 10px; border-radius: 4px; background: var(--ink); color: var(--bg); margin-bottom: 12px; animation: in .25s var(--ease); }
.lensbar .btn { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 35%, transparent); }
.lensbar .vt, .lensbar .sev { box-shadow: 0 0 0 1.5px var(--ink); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 12px; }
.search { position: relative; }
.search input { height: 28px; width: 220px; border: 1px solid var(--line); border-radius: 4px; background: var(--raised); padding: 0 8px 0 26px; font-size: 13px; }
.search svg { position: absolute; left: 8px; top: 7px; width: 14px; height: 14px; color: var(--ink-3); }
.fchip { font-weight: var(--w-mid); height: 26px; padding: 0 8px; border: 1px solid var(--line); background: var(--raised); border-radius: 3px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ghead { display: flex; gap: 8px; align-items: baseline; margin: 16px 0 8px; }
.ghead:first-child { margin-top: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 10px; }
.card { position: relative; background: var(--raised); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; transition: border-color .15s, transform .15s var(--ease), opacity .3s; }
.card:hover { border-color: var(--ink-3); }
.card.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.card.buy { border-style: dashed; border-color: var(--ink-3); background: var(--surface); }
.card.used { border-color: var(--ink); }
.card.dimmed { opacity: .35; }
.card .ph { width: 100%; aspect-ratio: 1; border-radius: 0; }
.card .ph svg { width: 30%; height: 30%; }
.card .b { padding: 7px 8px 8px; display: grid; gap: 5px; }
.card .n { font-size: 13px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
.card .f { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.card .tags { display: flex; gap: 3px; flex-wrap: wrap; }
.card .flag { position: absolute; top: 6px; right: 6px; display: flex; gap: 3px; }
.card .role { position: absolute; top: 6px; left: 6px; font: 500 11.5px var(--mono); background: var(--ink); color: var(--bg); padding: 0 5px; border-radius: 2px; }
.card.buy .role { background: var(--raised); color: var(--ink-2); border: 1px dashed var(--ink-3); }
@media (max-width: 520px) { .cards { grid-template-columns: repeat(2, minmax(0,1fr)); } .search { flex: 1 1 100%; } .search input { width: 100%; } }

/* projects list */
.plist { display: grid; gap: 10px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 4px; text-decoration: none; }
.prow:hover { border-color: var(--ink-3); }
.prow .d { color: var(--ink-2); }

/* map */
.mapwrap { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: auto; background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 16px 16px; max-height: 76vh; }
.map { display: block; height: auto; user-select: none; }
.map text { font-family: var(--sans); fill: var(--ink); }
.map .pin { font: 500 11px var(--mono); fill: var(--ink-2); }
.map .lab { font: 600 11.5px var(--mono); }
.map .node rect.box { fill: var(--raised); stroke: var(--ink-3); stroke-width: 1; transition: stroke .2s; }
.map .node.buy rect.box { stroke-dasharray: 4 3; }
.map .node .nm { font-size: 13px; font-weight: var(--w-strong); }
.map .node .st { font: 500 11px var(--mono); fill: var(--ink-2); }
.map .node .gl { fill: none; stroke: var(--ink-3); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.map .node .phb { fill: var(--bg); }
.map .node { cursor: pointer; transition: opacity .25s; }
.map .node.fresh { animation: pop .6s var(--ease); transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { opacity: 0; transform: scale(.85); } }
.map .node:hover rect.box { stroke: var(--ink); }
.map .node.sel rect.box { stroke: var(--sel); stroke-width: 2; stroke-dasharray: none; }
.map .net { cursor: pointer; transition: opacity .25s; }
.map .net path.w { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.map .net path.bus { fill: none; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
.map .net path.bus-in { fill: none; stroke: var(--surface); stroke-width: 1.4; stroke-linejoin: round; }
.map .net path.hit { fill: none; stroke: transparent; stroke-width: 14; }
.map .net path.flow { fill: none; stroke: var(--surface); stroke-width: 2.2; stroke-dasharray: 2 10; stroke-linecap: round; opacity: 0; }
.map .net.hot path.flow { opacity: 1; animation: flow .9s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -12; } }
.map .net.sel path.w { stroke-width: 3.2; }
.mapwrap.focus .node:not(.on), .mapwrap.focus .net:not(.on), .mapwrap.focus .mk:not(.on) { opacity: .16; }
.map .mk { cursor: pointer; transition: opacity .25s; }
.map .mk circle.b { stroke: var(--surface); stroke-width: 2; }
.map .mk text { font: 700 11.5px var(--mono); fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.map .mk.check text { fill: #1a1400; }
.map .mk.danger circle.b { fill: var(--danger); } .map .mk.check circle.b { fill: var(--check); } .map .mk.ok circle.b { fill: var(--ok); }
.map .mk.done circle.b { fill: var(--surface); stroke: var(--ok); stroke-width: 1.8; } .map .mk.done text { fill: var(--ok); }
.map .mk .ring { fill: none; stroke-width: 2; opacity: 0; }
.map .mk .ring { pointer-events: none; } .map .mk .mhit { fill: transparent; pointer-events: all; }
.map .mk.danger:not(.done) .ring { stroke: var(--danger); animation: ring 2.4s var(--ease) infinite; }
@keyframes ring { 0% { opacity: .7; r: 9; } 70%, 100% { opacity: 0; r: 18; } }
.map .mk.sel circle.b { stroke: var(--ink); stroke-width: 2.4; }
.zoom { position: sticky; left: 8px; top: 8px; z-index: 2; display: inline-flex; gap: 4px; margin: 8px; }
.zoom .btn { height: 26px; padding: 0 8px; }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 10px; color: var(--ink-2); font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 3px; border-radius: 2px; display: block; }
.tray { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tray .item { display: inline-flex; align-items: center; gap: 8px; padding: 4px 9px 4px 4px; border: 1px dashed var(--ink-3); border-radius: 4px; background: var(--raised); cursor: pointer; font-size: 13px; }
.tray .item.own { border-style: solid; }
.tray .item .ph { width: 22px; height: 22px; }

/* focus view (one part + neighbours) */
.fview { display: grid; gap: 10px; max-width: 640px; }
.fcenter { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 10px; align-items: center; padding: 10px; background: var(--raised); border: 2px solid var(--ink); border-radius: 6px; animation: in .3s var(--ease); }
.fcenter .ph { width: 52px; height: 52px; }
.fcenter.buy { border-style: dashed; }
.fnet { display: grid; grid-template-columns: 4px minmax(0,1fr); gap: 10px; animation: in .35s var(--ease) both; }
.fnet .rail { border-radius: 2px; }
.fnet .hd { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding-top: 2px; }
.fnet .hd b { font-weight: 600; }
.fnet .via { font: 500 12px var(--mono); color: var(--ink-2); }
.nbrs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.nbr { display: inline-flex; align-items: center; gap: 7px; padding: 4px 8px 4px 4px; border: 1px solid var(--line); background: var(--raised); border-radius: 4px; cursor: pointer; text-align: left; }
.nbr.buy { border-style: dashed; }
.nbr:hover { border-color: var(--ink); }
.nbr .ph { width: 26px; height: 26px; }
.nbr small { display: block; font: 500 11.5px var(--mono); color: var(--ink-3); }
.fwarn { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; font-size: 13px; cursor: pointer; }
.fwarn:hover b { text-decoration: underline; }
.fwarn b { font-weight: 500; }
.crumbs { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font: 500 12px var(--mono); color: var(--ink-3); }
.crumbs button { background: none; border: 0; padding: 0; color: var(--ink-2); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font: inherit; }

/* metro view */
.metro { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px 22px; align-items: start; }
.line { padding: 8px 0; animation: in .3s var(--ease) both; }
.line .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.line .hd b { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.line .hd b i { width: 14px; height: 4px; border-radius: 2px; display: block; }
.stops { position: relative; padding-left: 26px; }
.stops::before { content: ""; position: absolute; left: 8px; top: 9px; bottom: 9px; width: 4px; border-radius: 2px; background: var(--c); }
.stop { position: relative; padding: 4px 0 8px; cursor: pointer; }
.stop::before { content: ""; position: absolute; left: -23px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--raised); border: 3px solid var(--c); }
.stop.term::before { width: 12px; height: 12px; left: -24px; top: 6px; background: var(--c); }
.stop b { font-weight: 500; }
.stop .pinl { font: 500 12px var(--mono); color: var(--ink-2); margin-left: 6px; }
.stop.buy b { text-decoration: underline dashed var(--ink-3); text-underline-offset: 3px; }
.stop:hover b { text-decoration: underline; }
.stop .sevs { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: -3px; }

/* lists + inspector bits */
.lst { border-top: 1px solid var(--line); }
.lst .grp { padding: 14px 0 6px; }
.lrow { display: grid; grid-template-columns: 28px minmax(0, 1fr) 130px 104px 70px; gap: 12px; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--hair); cursor: pointer; }
.lrow:hover { background: var(--surface); }

function relations(obj, selfId) {
  const f = obj.f || {}; const out = [];
  if (obj.cat === 'Microcontrollers') {
    PARTS.filter((x) => x.id !== selfId).forEach((x) => {

      if (x.f && x.f.vin && x.f.vin[1] < 4 && f.io > 4) out.push(['danger', x, `3.3 V only. This board’s pins send 5 V: use a level shifter.`]);
      if (x.f && x.f.vin && x.f.vin[0] > 3.6 && f.io < 4) out.push(['info', x, 'Needs 5 V power. Feed it from this board’s 5V/VIN pin; its signals are fine.']);
    });
    const ok = PARTS.filter((x) => x.cat !== 'Microcontrollers' && x.f && x.f.vin && !out.some((r) => r[1] === x)).length;
    if (ok) out.push(['ok', null, `${ok} of your sensors and screens connect to it directly.`]);
  } else if (f.vin || f.out) {
    BOARDS().forEach((b) => {
      const o = Math.max(0, ...Object.values(f.out || {}));
      if (o && o > b.f.io) out.push(['check', b, `Needs a ${term('divider')} on ${Object.keys(f.out)[0]}: it sends ${o} V, the board takes ${b.f.io} V.`]);
      else if (f.vin && f.vin[1] < 4 && b.f.io > 4) out.push(['danger', b, `The board sends 5 V on its pins. Use a level shifter.`]);
      else if (f.vin && f.vin[0] > 3.6 && b.f.io < 4) out.push(['info', b, 'Power it from the board’s 5V/VIN pin. Signals connect directly.']);
      else out.push(['ok', b, 'Connects directly.']);
    });
  }
  if (f.i2c) {
    const others = PARTS.filter((x) => x.id !== selfId && x.f && x.f.i2c);
    const clash = others.filter((x) => x.f.i2c === f.i2c);
    clash.forEach((x) => out.push(['danger', x, `Same I2C ${term('address')} (${f.i2c}). They cannot share the same two wires.`]));
    if (!clash.length && others.length) out.push(['ok', null, `I2C ${f.i2c} differs from your other I2C parts (${others.map((x) => `${x.name.split(' (')[0]} ${x.f.i2c}`).join(', ')}). They can share the wires.`]);
  }
  ((KNOW[selfId] || {}).pairs || []).forEach((pid) => { const x = partById(pid); if (x) out.push(['pair', x, 'Goes with this part. You own one.']); });
  return out;
}
